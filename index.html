<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Markdown Editor</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="index.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#1e1e1e">


</head>











<button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
    <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 256 256" aria-hidden="true">
        <path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/>
    </svg>

    <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 256 256" aria-hidden="true">
        <path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"/>
    </svg>
</button>

<script>
    const themeToggle =
        document.getElementById("themeToggle");



    themeToggle.addEventListener("click", () => {
        const current =
            document.documentElement.dataset.theme;

        const systemDark =
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

        const isDark =
            current
                ? current === "dark"
                : systemDark;

        const next =
            isDark ? "light" : "dark";

        document.documentElement.dataset.theme =
            next;

        localStorage.setItem(
            "markdown-editor-theme",
            next
        );
    });
</script>


<script> // Read the theme var and apply it
    const savedTheme =
        localStorage.getItem("markdown-editor-theme");

    if (savedTheme) {
        document.documentElement.dataset.theme =
            savedTheme;
    }
</script>







<body>
    <main class="welcome">






        <div class="welcome-content">

            <div class="title">
                <img src="icons/icon_1.png" alt="Markdown Editor+" />
                <h1>Markdown Editor+</h1>
            </div>

            <p class="welcome-subtitle">
                By MarsChompsVenus (mcv-s)
            </p>

            <p class="welcome-subtitle">
                Write, edit, and preview Markdown; <br> now with a PWA.
            </p>

            <div class="welcome-actions">

                <button id="openFile">
                    Open a file
                </button>

                <button id="newFile">
                    Go to editor
                </button>

            </div>

        </div>

        <script>
            const openFileButton =
                document.getElementById("openFile");

            const newFileButton =
                document.getElementById("newFile");


            openFileButton.addEventListener("click", async () => {
                try {
                    /*
                     * This happens directly from the user's
                     * click, so the browser allows the picker.
                     */

                    const [handle] =
                        await window.showOpenFilePicker({
                            multiple: false,

                            types: [
                                {
                                    description: "Markdown files",

                                    accept: {
                                        "text/markdown": [
                                            ".md",
                                            ".markdown"
                                        ]
                                    }
                                }
                            ]
                        });


                    /*
                     * Store the file handle.
                     */

                    const dbRequest =
                        indexedDB.open(
                            "markdown-editor",
                            1
                        );


                    dbRequest.onupgradeneeded = () => {
                        const db =
                            dbRequest.result;

                        if (
                            !db.objectStoreNames.contains(
                                "files"
                            )
                        ) {
                            db.createObjectStore("files");
                        }
                    };


                    dbRequest.onerror = () => {
                        console.error(
                            "Failed to open database:",
                            dbRequest.error
                        );
                    };


                    dbRequest.onsuccess = () => {
                        const db =
                            dbRequest.result;

                        const transaction =
                            db.transaction(
                                "files",
                                "readwrite"
                            );


                        transaction
                            .objectStore("files")
                            .put(
                                handle,
                                "currentFile"
                            );


                        transaction.oncomplete = () => {

                            /*
                             * Stay in the same tab.
                             *
                             * editor.html will see restore=1,
                             * retrieve the handle, and load it.
                             */

                            window.location.href =
                                "editor.html?restore=1";
                        };


                        transaction.onerror = () => {
                            console.error(
                                "Failed to save file handle:",
                                transaction.error
                            );
                        };
                    };

                } catch (error) {

                    if (error.name !== "AbortError") {
                        console.error(
                            "Failed to open file:",
                            error
                        );
                    }

                }
            });


            newFileButton.addEventListener(
                "click",
                () => {
                    window.location.href =
                        "editor.html";
                }
            );
        </script>










    </main>
    <script src="program.js"></script>


</body>

</html>

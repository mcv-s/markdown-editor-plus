<html lang="en">

<head>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="index.css">

<button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
    <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true">
        <path
            d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z" />
    </svg>

    <svg class="theme-icon moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" aria-hidden="true">
        <path
            d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z" />
    </svg>
</button>

<script>
    const themeToggle =
        document.getElementById("themeToggle");



    themeToggle.addEventListener("click", () => {
        const current =
            document.documentElement.dataset.theme;

        const systemDark =
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

        const isDark =
            current
                ? current === "dark"
                : systemDark;

        const next =
            isDark ? "light" : "dark";

        document.documentElement.dataset.theme =
            next;

        localStorage.setItem(
            "markdown-editor-theme",
            next
        );
    });
</script>


<script> // Read the theme var and apply it
    const savedTheme =
        localStorage.getItem("markdown-editor-theme");

    if (savedTheme) {
        document.documentElement.dataset.theme =
            savedTheme;
    }
</script>







<body>
    <main class="welcome">






        <div class="welcome-content">

            <div class="title">
                <img src="icons/icon_1.png" alt="Markdown Editor+" />
                <h1>Markdown Editor+</h1>
            </div>

            <p class="welcome-subtitle">
                By <a href="https://github.com/mcv-s" target="_blank" rel="noopener noreferrer"
                    style="color: inherit; text-decoration: inherit;">MarsChompsVenus (mcv-s)</a>
            </p>

            <p class="welcome-subtitle">
                Write, edit, and preview Markdown; <br> now with a PWA.
            </p>

            <div class="welcome-actions">

                <button id="openFile">
                    Open a file
                </button>

                <button id="newFile">
                    Go to editor
                </button>

                <button id="openLastFile">
                    Open Last File
                </button>

            </div>

        </div>

        <script>
            const openFileButton =
                document.getElementById("openFile");

            const newFileButton =
                document.getElementById("newFile");

            const openLastFileButton =
                document.getElementById("openLastFile");


            /*
             * ------------------------------------------------------------
             * File storage helpers
             * ------------------------------------------------------------
             */

            const DB_NAME = "markdown-editor";
            const STORE_NAME = "files";
            const HANDLE_KEY = "currentFile";
            const FALLBACK_FILE_KEY = "markdown-editor-last-file";


            function supportsFileSystemAccess() {
                return (
                    typeof window.showOpenFilePicker === "function" &&
                    typeof window.indexedDB !== "undefined"
                );
            }


            function openDatabase() {
                return new Promise((resolve, reject) => {
                    const request =
                        indexedDB.open(DB_NAME, 1);

                    request.onupgradeneeded = () => {
                        const db = request.result;

                        if (
                            !db.objectStoreNames.contains(STORE_NAME)
                        ) {
                            db.createObjectStore(STORE_NAME);
                        }
                    };

                    request.onsuccess = () => {
                        resolve(request.result);
                    };

                    request.onerror = () => {
                        reject(request.error);
                    };
                });
            }


            async function saveFileHandle(handle) {
                const db = await openDatabase();

                return new Promise((resolve, reject) => {
                    const transaction =
                        db.transaction(
                            STORE_NAME,
                            "readwrite"
                        );

                    transaction
                        .objectStore(STORE_NAME)
                        .put(handle, HANDLE_KEY);

                    transaction.oncomplete = () => {
                        db.close();
                        resolve();
                    };

                    transaction.onerror = () => {
                        db.close();
                        reject(transaction.error);
                    };
                });
            }


            /*
             * ------------------------------------------------------------
             * Modern File System Access API
             * ------------------------------------------------------------
             */

            async function openFileWithFileSystemAccess() {
                const [handle] =
                    await window.showOpenFilePicker({
                        multiple: false,

                        types: [
                            {
                                description: "Markdown files",

                                accept: {
                                    "text/markdown": [
                                        ".md",
                                        ".markdown"
                                    ]
                                }
                            }
                        ]
                    });


                /*
                 * Save the handle so editor.html can restore it.
                 */

                await saveFileHandle(handle);


                /*
                 * Go to the editor and tell it to restore
                 * the saved file.
                 */

                window.location.href =
                    "editor.html?restore=1";
            }


            /*
             * ------------------------------------------------------------
             * Platform-independent fallback
             * ------------------------------------------------------------
             */

            function openFileWithInput() {
                return new Promise((resolve) => {

                    const input =
                        document.createElement("input");

                    input.type = "file";

                    input.accept =
                        ".md,.markdown,text/markdown,text/plain";


                    input.addEventListener(
                        "change",
                        async () => {

                            const file =
                                input.files?.[0];

                            if (!file) {
                                resolve();
                                return;
                            }


                            try {

                                const contents =
                                    await file.text();


                                /*
                                 * Save the actual file contents locally.
                                 *
                                 * This is the fallback equivalent of
                                 * saving a FileSystemFileHandle.
                                 */

                                localStorage.setItem(
                                    FALLBACK_FILE_KEY,
                                    JSON.stringify({
                                        name: file.name,
                                        contents: contents
                                    })
                                );


                                /*
                                 * Tell the editor to restore the
                                 * locally cached file.
                                 */

                                window.location.href =
                                    "editor.html?restore=1&fallback=1";

                            } catch (error) {

                                console.error(
                                    "Failed to read file:",
                                    error
                                );
                            }

                            resolve();
                        }
                    );


                    /*
                     * The input must be triggered directly from
                     * the user's click.
                     */

                    input.click();
                });
            }


            /*
             * ------------------------------------------------------------
             * Open file
             * ------------------------------------------------------------
             */

            openFileButton.addEventListener(
                "click",
                async () => {

                    try {

                        if (
                            supportsFileSystemAccess()
                        ) {

                            /*
                             * Preferred method:
                             * File System Access API
                             */

                            await openFileWithFileSystemAccess();

                        } else {

                            /*
                             * Fallback:
                             * traditional <input type="file">
                             */

                            await openFileWithInput();
                        }

                    } catch (error) {

                        /*
                         * Closing the native picker is not an error.
                         */

                        if (
                            error?.name !== "AbortError"
                        ) {
                            console.error(
                                "Failed to open file:",
                                error
                            );
                        }
                    }
                }
            );


            /*
             * ------------------------------------------------------------
             * New file
             * ------------------------------------------------------------
             */

            newFileButton.addEventListener(
                "click",
                () => {
                    window.location.href =
                        "editor.html";
                }
            );


            /*
             * ------------------------------------------------------------
             * Open last file
             * ------------------------------------------------------------
             */

            openLastFileButton.addEventListener(
                "click",
                () => {

                    /*
                     * The editor will determine whether the
                     * modern handle or fallback data exists.
                     */

                    window.location.href =
                        "editor.html?restore=1";
                }
            );
        </script>










    </main>
    <script src="program.js"></script>


</body>

</html>

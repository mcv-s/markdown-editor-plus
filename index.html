<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Markdown Editor</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="index.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#1e1e1e">


</head>






<body>
    <main class="welcome">






        <div class="welcome-content">

            <div class="title">
                <img src="icons/icon_1.png" alt="Markdown Editor+" />
                <h1>Markdown Editor+</h1>
            </div>

            <p class="welcome-subtitle">
                By MarsChompsVenus (mcv-s)
            </p>

            <p class="welcome-subtitle">
                Write, edit, and preview Markdown; <br> now with a PWA.
            </p>

            <div class="welcome-actions">

                <button id="openFile">
                    Open a file
                </button>

                <button id="newFile">
                    Go to editor
                </button>

            </div>

        </div>

        <script>
            const openFileButton =
                document.getElementById("openFile");

            const newFileButton =
                document.getElementById("newFile");


            openFileButton.addEventListener("click", async () => {
                try {
                    /*
                     * This happens directly from the user's
                     * click, so the browser allows the picker.
                     */

                    const [handle] =
                        await window.showOpenFilePicker({
                            multiple: false,

                            types: [
                                {
                                    description: "Markdown files",

                                    accept: {
                                        "text/markdown": [
                                            ".md",
                                            ".markdown"
                                        ]
                                    }
                                }
                            ]
                        });


                    /*
                     * Store the file handle.
                     */

                    const dbRequest =
                        indexedDB.open(
                            "markdown-editor",
                            1
                        );


                    dbRequest.onupgradeneeded = () => {
                        const db =
                            dbRequest.result;

                        if (
                            !db.objectStoreNames.contains(
                                "files"
                            )
                        ) {
                            db.createObjectStore("files");
                        }
                    };


                    dbRequest.onerror = () => {
                        console.error(
                            "Failed to open database:",
                            dbRequest.error
                        );
                    };


                    dbRequest.onsuccess = () => {
                        const db =
                            dbRequest.result;

                        const transaction =
                            db.transaction(
                                "files",
                                "readwrite"
                            );


                        transaction
                            .objectStore("files")
                            .put(
                                handle,
                                "currentFile"
                            );


                        transaction.oncomplete = () => {

                            /*
                             * Stay in the same tab.
                             *
                             * editor.html will see restore=1,
                             * retrieve the handle, and load it.
                             */

                            window.location.href =
                                "editor.html?restore=1";
                        };


                        transaction.onerror = () => {
                            console.error(
                                "Failed to save file handle:",
                                transaction.error
                            );
                        };
                    };

                } catch (error) {

                    if (error.name !== "AbortError") {
                        console.error(
                            "Failed to open file:",
                            error
                        );
                    }

                }
            });


            newFileButton.addEventListener(
                "click",
                () => {
                    window.location.href =
                        "editor.html";
                }
            );
        </script>










    </main>
    <script src="program.js"></script>


</body>

</html>
